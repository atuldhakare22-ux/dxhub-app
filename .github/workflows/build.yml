name: Build DX HUB APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Clean Project & Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          rm -f settings.gradle.txt build.gradle.txt
          rm -rf app/src/main/java/com/dxhub/player app/src/main/res
          mkdir -p app/src/main/java/com/dxhub/player app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DXHUB"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dxhub.player'
              compileSdk 34

              defaultConfig {
                  applicationId "com.dxhub.player"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          ICON_B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            echo "$ICON_B64" | base64 -d > "app/src/main/res/${folder}/ic_launcher.png"
          done

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="DX HUB"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="dxhub" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/dxhub/player/MainActivity.java
          package com.dxhub.player;

          import android.annotation.SuppressLint;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static final String SERVER_URL = "https://dxhub-server.onrender.com";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setAllowFileAccess(true);

                  webView.addJavascriptInterface(new DXBridge(), "AndroidBridge");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("https://t.me/") || url.startsWith("tg://")) {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              return true;
                          }
                          return false;
                      }
                  });

                  String deepVidId = "";
                  Uri data = getIntent().getData();
                  if (data != null) {
                      String path = data.getPath();
                      if (path != null && path.length() > 1) {
                          deepVidId = path.substring(1);
                      }
                  }

                  webView.loadDataWithBaseURL(SERVER_URL, buildAppHtml(deepVidId), "text/html", "UTF-8", null);
              }

              public class DXBridge {
                  @JavascriptInterface
                  public void copyToClipboard(String text) {
                      runOnUiThread(() -> {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null) {
                              cm.setPrimaryClip(ClipData.newPlainText("DX HUB Link", text));
                          }
                      });
                  }

                  @JavascriptInterface
                  public void shareText(String text) {
                      runOnUiThread(() -> {
                          Intent sendIntent = new Intent(Intent.ACTION_SEND);
                          sendIntent.putExtra(Intent.EXTRA_TEXT, text);
                          sendIntent.setType("text/plain");
                          startActivity(Intent.createChooser(sendIntent, "Share DX HUB"));
                      });
                  }

                  @JavascriptInterface
                  public void downloadEncryptedVideo(String vidId, String fileName) {
                      new Thread(() -> {
                          try {
                              File vaultDir = new File(getFilesDir(), "dx_vault");
                              if (!vaultDir.exists()) vaultDir.mkdirs();
                              File outFile = new File(vaultDir, vidId + ".dxv");

                              URL url = new URL(SERVER_URL + "/stream/" + vidId);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.connect();

                              InputStream is = conn.getInputStream();
                              FileOutputStream fos = new FileOutputStream(outFile);
                              byte[] buf = new byte[8192];
                              int len;
                              while ((len = is.read(buf)) > 0) {
                                  fos.write(buf, 0, len);
                              }
                              fos.close();
                              is.close();

                              runOnUiThread(() -> webView.evaluateJavascript("onDownloadComplete('" + vidId + "', '" + fileName + "')", null));
                          } catch (Exception e) {
                              runOnUiThread(() -> webView.evaluateJavascript("alert('Download Error: " + e.getMessage() + "')", null));
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public String getLocalVideoPath(String vidId) {
                      File f = new File(new File(getFilesDir(), "dx_vault"), vidId + ".dxv");
                      return f.exists() ? "file://" + f.getAbsolutePath() : "";
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              private String buildAppHtml(String deepVidId) {
                  return "<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'>" +
                         "<style>" +
                         "*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}" +
