                         "<h3 style='color:#0284c7'>🔒 Protected Links</h3>" +
                         "<p style='font-size:12px;color:#475569;margin-top:4px'>Enter PIN 1234</p>" +
                         "<input type='password' id='userPinInput' maxlength='4' placeholder='Enter PIN (1234)' style='text-align:center;font-size:18px;letter-spacing:5px'>" +
                         "<button class='btn' onclick='verifyUserPin()'>Open</button>" +
                         "<button class='btn' style='background:#64748b' onclick='closeModals()'>Cancel</button>" +
                         "</div></div>" +

                         "<div id='rewardOverlay' class='overlay hidden'>" +
