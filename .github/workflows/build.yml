                         ".stat-row{display:flex;gap:8px;margin-top:10px}" +
                         ".stat-box{flex:1;background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:10px;text-align:center}" +
                         ".policy-box{background:#f8fafc;border:1px solid #bae6fd;border-radius:10px;padding:10px;margin-top:8px;font-size:12px;color:#334155;line-height:1.5}" +
                         ".bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#ffffff;border-top:1px solid #bae6fd;display:flex;justify-content:space-around;padding:8px 4px;z-index:25}" +
                         ".nav-btn{background:none;border:none;color:#64748b;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 6px}" +
                         ".nav-btn.active{color:#0284c7}" +
