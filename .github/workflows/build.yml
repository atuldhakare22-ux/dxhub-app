                         "</style></head><body>" +

                         "<div id='adminAuthModal' class='overlay hidden'>" +
                         "<div class='card' style='max-width:320px;width:100%'>" +
                         "<h3 style='color:#0284c7'>Admin Login</h3>" +
                         "<p style='font-size:12px;color:#475569;margin-top:4px'>Enter Admin Password</p>" +
                         "<input type='password' id='adminPassInput' placeholder='Admin Password'>" +
                         "<button class='btn' onclick='verifyAdminPass()'>Unlock Admin Panel</button>" +
                         "<button class='btn' style='background:#64748b' onclick='closeModals()'>Cancel</button>" +
                         "</div></div>" +

                         "<div id='userLockModal' class='overlay hidden'>" +
