                         "input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #7dd3fc;background:#f8fafc;color:#0f172a;margin-top:8px;font-size:14px}" +
                         ".mini-ad-box{background:#dbeafe;border:1px dashed #38bdf8;margin:10px 12px;padding:10px;border-radius:12px;color:#0369a1;text-align:center}" +
