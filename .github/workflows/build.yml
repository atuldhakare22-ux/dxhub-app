                         "}" +
                         "function closeModals(){ document.getElementById('adminAuthModal').classList.add('hidden'); document.getElementById('userLockModal').classList.add('hidden'); }" +
                         "function loadAdminFields(){" +
                         "  document.getElementById('admAdsOn').value=cfg.on?'1':'0';" +
                         "  document.getElementById('admBanner').value=cfg.banner||'TEST';" +
                         "  document.getElementById('admMrec').value=cfg.mrec||'TEST';" +
                         "  document.getElementById('admReward').value=cfg.reward||'TEST';" +
                         "  document.getElementById('admCpm').value=cfg.cpm||'4.00';" +
                         "  document.getElementById('admIpLimit').value=cfg.ipLimit||'1';" +
                         "  document.getElementById('admViewPct').value=cfg.viewPct||'100';" +
                         "  document.getElementById('admPremImg').value=cfg.premImg||'';" +
                         "  document.getElementById('admPremCaption').value=cfg.premCaption||'';" +
                         "  document.getElementById('admPremLink').value=cfg.premLink||'https://t.me/helponn_bot';" +
                         "  document.getElementById('admContact').value=cfg.contact||'https://t.me/helponn_bot';" +
                         "  document.getElementById('admNewPass').value='';" +
                         "}" +
                         "function saveAdmin(){" +
                         "  cfg.on=document.getElementById('admAdsOn').value==='1';" +
                         "  cfg.banner=document.getElementById('admBanner').value.trim()||'TEST';" +
                         "  cfg.mrec=document.getElementById('admMrec').value.trim()||'TEST';" +
                         "  cfg.reward=document.getElementById('admReward').value.trim()||'TEST';" +
                         "  cfg.cpm=document.getElementById('admCpm').value.trim()||'4.00';" +
                         "  cfg.ipLimit=document.getElementById('admIpLimit').value.trim()||'1';" +
                         "  cfg.viewPct=document.getElementById('admViewPct').value.trim()||'100';" +
                         "  cfg.premImg=document.getElementById('admPremImg').value.trim();" +
                         "  cfg.premCaption=document.getElementById('admPremCaption').value.trim()||'Remove all Ads (₹299/month).';" +
                         "  cfg.premLink=document.getElementById('admPremLink').value.trim()||'https://t.me/helponn_bot';" +
                         "  cfg.contact=document.getElementById('admContact').value.trim()||'https://t.me/helponn_bot';" +
                         "  let np=document.getElementById('admNewPass').value.trim();" +
                         "  if(np){ adminPass=np; localStorage.setItem('dx_admin_pass', adminPass); }" +
                         "  localStorage.setItem('dx_cfg', JSON.stringify(cfg));" +
                         "  applyConfig(); alert('Saved!'); switchTab('home');" +
                         "}" +
                         "function applyConfig(){" +
                         "  let showAds = (!isVip && cfg.on);" +
                         "  let miniBox = document.getElementById('globalMiniAd');" +
                         "  if(showAds){ miniBox.classList.remove('hidden'); document.getElementById('miniAdLabel').innerText=cfg.reward||'TEST'; } else { miniBox.classList.add('hidden'); }" +
                         "  document.getElementById('premCaptionView').innerText=cfg.premCaption||'Remove all Ads (₹299/month).';" +
                         "  let imgEl=document.getElementById('premImgView');" +
                         "  if(cfg.premImg){ imgEl.src=cfg.premImg; imgEl.style.display='block'; }" +
                         "  document.getElementById('pubCpmText').innerText='$'+(parseFloat(cfg.cpm||4).toFixed(2));" +
                         "  if(isVip){ document.getElementById('vipBadge').innerText='VIP ACTIVE 👑'; }" +
                         "}" +
                         "function openPremiumLink(){ let u=cfg.premLink||'https://t.me/helponn_bot'; if(!u.startsWith('http')) u='https://t.me/'+u.replace(/^@/,''); window.location.href=u; }" +
                         "function openContactUs(){ let u=cfg.contact||'https://t.me/helponn_bot'; if(!u.startsWith('http')) u='https://t.me/'+u.replace(/^@/,''); window.location.href=u; }" +
                         "function shareDxApp(){ AndroidBridge.shareText('Download DX HUB App: ' + SERVER); }" +
                         "function connectTelegramPublisher(){" +
                         "  let pub=document.getElementById('pubChatInput').value.trim();" +
                         "  if(!pub){ alert('Enter Telegram / Publisher ID'); return; }" +
                         "  localStorage.setItem('dx_pub_id', pub);" +
                         "  loadPublisherStats();" +
                         "}" +
                         "function loadPublisherStats(){" +
                         "  let pub=document.getElementById('pubChatInput').value.trim() || localStorage.getItem('dx_pub_id') || '';" +
                         "  if(pub) document.getElementById('pubChatInput').value=pub;" +
                         "  let cpm=parseFloat(cfg.cpm||'4.00')||4.00;" +
                         "  let pct=Math.max(0, Math.min(100, parseFloat(cfg.viewPct||'100')||100));" +
                         "  document.getElementById('pubCpmText').innerText='$'+cpm.toFixed(2);" +
                         "  let listEl=document.getElementById('pubFilesList');" +
                         "  if(!pub){ listEl.innerHTML=\"<div class='hub-item'>अपना Publisher / Telegram ID डालकर Connect करें।</div>\"; return; }" +
                         "  fetch(SERVER+'/api/channel/'+encodeURIComponent(pub)).then(r=>r.json()).then(d=>{" +
                         "    let vids=d.videos||[];" +
                         "    let rawViews=vids.reduce((s,v)=>s+(parseInt(v.views||0,10)||0),0);" +
                         "    let counted=Math.round(rawViews*(pct/100));" +
                         "    let earn=(counted/1000)*cpm;" +
                         "    document.getElementById('pubViewsText').innerText=counted;" +
                         "    document.getElementById('pubEarnText').innerText='$'+earn.toFixed(2);" +
                         "    listEl.innerHTML=vids.map(v=>{" +
                         "      let link=SERVER+'/watch/'+v.vid_id+'?unlock=DX1234';" +
                         "      return \"<div class='hub-item'><img src='\"+SERVER+\"/api/thumb/\"+v.vid_id+\"' onerror=\\\"this.style.display='none'\\\"><div><b>\"+v.safe_name+\"</b></div><div class='link-box'>\"+link+\"</div><button class='btn btn-sm btn-blue' onclick=\\\"AndroidBridge.copyToClipboard('\"+link+\"');alert('Copied')\\\">Copy Link</button><button class='btn btn-sm' onclick=\\\"startVideoWithAd('\"+v.vid_id+\"')\\\">Open (Ad)</button></div>\";" +
                         "    }).join('');" +
                         "  }).catch(()=>{ listEl.innerHTML=\"<div class='hub-item'>Stats load नहीं हो सके।</div>\"; });" +
                         "}" +
                         "function loadVaultLinks(){" +
                         "  let pub=document.getElementById('vaultPubInput').value.trim() || localStorage.getItem('dx_pub_id') || '';" +
                         "  if(pub){ document.getElementById('vaultPubInput').value=pub; localStorage.setItem('dx_pub_id', pub); }" +
                         "  let box=document.getElementById('vaultList');" +
                         "  if(!pub){ box.innerHTML=\"<div class='hub-item'>Publisher / Telegram ID डालें।</div>\"; return; }" +
                         "  fetch(SERVER+'/api/channel/'+encodeURIComponent(pub)).then(r=>r.json()).then(d=>{" +
                         "    let vids=d.videos||[];" +
                         "    box.innerHTML=vids.map(v=>{" +
                         "      let link=SERVER+'/watch/'+v.vid_id+'?unlock=DX1234';" +
                         "      return \"<div class='hub-item'><img src='\"+SERVER+\"/api/thumb/\"+v.vid_id+\"' onerror=\\\"this.style.display='none'\\\"><div><b>\"+v.safe_name+\"</b></div><div class='link-box'>\"+link+\"</div><button class='btn btn-sm btn-blue' onclick=\\\"AndroidBridge.copyToClipboard('\"+link+\"');alert('Copied')\\\">Copy Link</button><button class='btn btn-sm' onclick=\\\"startVideoWithAd('\"+v.vid_id+\"')\\\">Open (Ad)</button></div>\";" +
                         "    }).join('');" +
                         "  }).catch(()=>{ box.innerHTML=\"<div class='hub-item'>Load failed.</div>\"; });" +
                         "}" +
                         "function openFromInput(){ let val=document.getElementById('linkBox').value.trim(); if(!val) return; let id=val.includes('/watch/')?val.split('/watch/')[1].split('?')[0]:val; startVideoWithAd(id); }" +
                         "function startVideoWithAd(id){ currentVid=id; triggerReward('stream'); }" +
                         "function triggerReward(act){" +
                         "  pendingAction=act; if(isVip || !cfg.on){ finishRewardAd(); return; }" +
                         "  document.getElementById('rewardOverlay').classList.remove('hidden');" +
                         "  document.getElementById('closeAdBtn').classList.add('hidden');" +
                         "  document.getElementById('adUnitLabel').innerText='Unit: '+(cfg.reward||'TEST');" +
                         "  let sec=15; document.getElementById('adTimerText').innerText='Ad in '+sec+'s...';" +
                         "  let iv=setInterval(()=>{ sec--; document.getElementById('adTimerText').innerText=sec>0?'Ad in '+sec+'s...':'Ready!'; if(sec<=0){ clearInterval(iv); document.getElementById('closeAdBtn').classList.remove('hidden'); } },1000);" +
                         "}" +
                         "function finishRewardAd(){" +
                         "  document.getElementById('rewardOverlay').classList.add('hidden');" +
                         "  if(pendingAction==='stream') startPlayer(currentVid);" +
                         "  else if(pendingAction==='download'){ alert('Downloading...'); AndroidBridge.downloadEncryptedVideo(currentVid, currentVid+'_.mp4'); }" +
                         "}" +
                         "function startPlayer(id){" +
                         "  currentVid=id; switchTab('none'); document.getElementById('playerView').classList.remove('hidden');" +
                         "  document.getElementById('playerTitle').innerText=id+'_.mp4';" +
                         "  let local=AndroidBridge.getLocalVideoPath(id);" +
                         "  document.getElementById('vidPlayer').src=local?local:(SERVER+'/stream/'+id);" +
                         "  document.getElementById('vidPlayer').play();" +
                         "}" +
                         "function onDownloadComplete(id){ let list=JSON.parse(localStorage.getItem('dx_dl')||'[]'); if(!list.includes(id)) list.push(id); localStorage.setItem('dx_dl', JSON.stringify(list)); alert('Saved Offline!'); renderDownloads(); }" +
                         "function renderDownloads(){ let list=JSON.parse(localStorage.getItem('dx_dl')||'[]'); let box=document.getElementById('downloadsList'); if(!list.length){ box.innerHTML='No offline files yet.'; return; } box.innerHTML=list.map(id=>\"<div style='padding:8px;background:#f0f9ff;border-radius:8px;margin-top:6px;display:flex;justify-content:space-between;border:1px solid #bae6fd'><span>🔒 \"+id+\"_.mp4</span><b style='color:#0284c7' onclick=\\\"startPlayer('\"+id+\"')\\\">PLAY</b></div>\").join(''); }" +
                         "function activateVip(){ let k=document.getElementById('vipKeyInput').value.trim(); fetch(SERVER+'/api/verify_vip/'+k).then(r=>r.json()).then(d=>{ if(d.valid){ isVip=true; localStorage.setItem('dx_vip','1'); applyConfig(); alert('VIP Activated!'); } else alert('Invalid Key'); }); }" +
                         (!deepVidId.isEmpty() ? "startVideoWithAd('" + deepVidId + "');" : "") +
                         "</script></body></html>";
              }
          }
          EOF

          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip -q gradle.zip
          ./gradle-8.4/bin/gradle assembleDebug --no-daemon

      - name: Upload DX HUB APK
        uses: actions/upload-artifact@v4
        with:
          name: DX-HUB-App
          path: app/build/outputs/apk/debug/app-debug.apk
